<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Custom M3U IPTV Web Player</title>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #1a1a1e;
            --bg-card: #24242a;
            --accent: #e50914;
            --accent-hover: #ff1e27;
            --fav-color: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --border: #33333b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        .sidebar {
            width: 420px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* M3U Input Bar */
        .url-box {
            display: flex;
            gap: 6px;
        }

        .url-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            font-size: 0.82rem;
        }

        .url-box button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .url-box button:hover {
            background: var(--accent-hover);
        }

        .reset-link-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            text-align: right;
            text-decoration: underline;
            align-self: flex-end;
            margin-top: -4px;
        }

        .reset-link-btn:hover {
            color: var(--text-main);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 15px 9px 38px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .category-select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 6px;
            background: transparent;
            position: relative;
        }

        .channel-item:hover {
            background-color: var(--bg-card);
        }

        .channel-item.active {
            background-color: var(--accent);
            color: #fff;
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: contain;
            background-color: #000;
            padding: 2px;
        }

        .channel-info {
            flex: 1;
            overflow: hidden;
        }

        .channel-title {
            font-size: 0.88rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-group {
            font-size: 0.73rem;
            color: var(--text-sub);
        }

        .channel-item.active .channel-group {
            color: rgba(255, 255, 255, 0.8);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s, transform 0.2s;
        }

        .fav-btn:hover {
            transform: scale(1.15);
        }

        .fav-btn.active {
            color: var(--fav-color);
        }

        /* Player Section */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            position: relative;
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            outline: none;
        }

        .player-info {
            padding: 15px 25px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .current-logo {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: contain;
            display: none;
            background: #000;
        }

        .current-title-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-title {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .player-fav-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
            transition: color 0.2s, transform 0.2s;
        }

        .player-fav-btn:hover {
            transform: scale(1.15);
        }

        .player-fav-btn.active {
            color: var(--fav-color);
        }

        .status-badge {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            font-size: 0.95rem;
            border: 1px solid var(--border);
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 55vh;
            }
            .main-content {
                height: 45vh;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="header">
            <h1><i class="fa-solid fa-play"></i> Custom IPTV Player</h1>
            
            <!-- URL Input Area -->
            <div class="url-box">
                <input type="text" id="m3uUrlInput" placeholder="กรอก M3U / M3U8 URL ของคุณที่นี่...">
                <button id="loadUrlBtn"><i class="fa-solid fa-download"></i> โหลด</button>
            </div>
            <button class="reset-link-btn" id="resetDefaultBtn">ใช้ลิงก์เริ่มต้น (iptv-org)</button>

            <!-- Search Box -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อช่อง หรือประเทศ...">
            </div>

            <!-- Category Filter -->
            <select id="categorySelect" class="category-select">
                <option value="ALL">กำลังโหลดหมวดหมู่...</option>
            </select>
        </div>

        <div class="channel-list" id="channelList">
            <!-- รายชื่อช่องจะสร้างขึ้นที่นี่ -->
        </div>
    </div>

    <!-- Main Player Area -->
    <div class="main-content">
        <div class="video-container">
            <div class="status-badge" id="statusMessage">
                <i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงข้อมูลช่องรายการ...
            </div>
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <div class="player-info">
            <img id="currentLogo" class="current-logo" src="" alt="Logo">
            <div class="current-title-container">
                <div class="current-title" id="currentTitle">กรุณาเลือกช่องรายการเพื่อรับชม</div>
                <button class="player-fav-btn" id="playerFavBtn" title="บันทึกช่องโปรด">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_M3U_URL = "https://iptv-org.github.io/iptv/index.m3u";
        const CORS_PROXY = "https://corsproxy.io/?";

        let channels = [];
        let categories = new Set();
        let favorites = new Set(JSON.parse(localStorage.getItem('iptv_favorites') || '[]'));
        let currentPlayingChannel = null;
        let hls = null;

        const video = document.getElementById('videoPlayer');
        const channelListEl = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const currentTitleEl = document.getElementById('currentTitle');
        const currentLogoEl = document.getElementById('currentLogo');
        const playerFavBtn = document.getElementById('playerFavBtn');
        const statusMessageEl = document.getElementById('statusMessage');
        const m3uUrlInput = document.getElementById('m3uUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const resetDefaultBtn = document.getElementById('resetDefaultBtn');

        // Fetch M3U Playlist
        async function fetchPlaylist(targetUrl) {
            statusMessageEl.style.display = 'flex';
            statusMessageEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงข้อมูลช่องรายการ...`;

            try {
                let response;
                try {
                    response = await fetch(targetUrl);
                    if (!response.ok) throw new Error();
                } catch (e) {
                    response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
                }

                const data = await response.text();
                
                // Reset State
                channels = [];
                categories.clear();
                
                parseM3U(data);
                
                // บันทึก URL ล่าสุดลง LocalStorage
                localStorage.setItem('iptv_last_url', targetUrl);
                
                statusMessageEl.style.display = 'none';
                renderCategories();
                renderChannels();
            } catch (err) {
                console.error(err);
                statusMessageEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#e50914;"></i> โหลด Playlist ไม่สำเร็จ โปรดตรวจสอบ URL หรือการเชื่อมต่ออินเทอร์เน็ต`;
            }
        }

        // Parse M3U Text
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            let currentChannel = null;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    // Extract Logo
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                    // Extract Category / Group
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) {
                        currentChannel.group = groupMatch[1];
                        categories.add(groupMatch[1]);
                    } else {
                        currentChannel.group = "General";
                    }

                    // Extract Channel Name
                    const nameParts = line.split(',');
                    if (nameParts.length > 1) {
                        currentChannel.name = nameParts[nameParts.length - 1].trim();
                    } else {
                        currentChannel.name = "Unnamed Channel";
                    }
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
        }

        // Save Favorites to LocalStorage
        function saveFavorites() {
            localStorage.setItem('iptv_favorites', JSON.stringify(Array.from(favorites)));
        }

        // Toggle Favorite Item
        function toggleFavorite(url, event) {
            if (event) event.stopPropagation();

            if (favorites.has(url)) {
                favorites.delete(url);
            } else {
                favorites.add(url);
            }
            saveFavorites();
            
            renderChannels(searchInput.value, categorySelect.value);
            updatePlayerFavBtn();
        }

        // Render Dropdown Category Options
        function renderCategories() {
            categorySelect.innerHTML = '';
            
            const favOption = document.createElement('option');
            favOption.value = 'FAVORITES';
            favOption.textContent = `⭐ ช่องโปรดของฉัน (${favorites.size})`;
            categorySelect.appendChild(favOption);

            const allOption = document.createElement('option');
            allOption.value = 'ALL';
            allOption.textContent = 'แสดงทุกหมวดหมู่ / ประเทศทั้งหมด';
            categorySelect.appendChild(allOption);

            Array.from(categories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }

        // Render Channel List
        function renderChannels(filterText = '', filterCategory = 'ALL') {
            channelListEl.innerHTML = '';
            
            if (categorySelect.options.length > 0) {
                categorySelect.options[0].textContent = `⭐ ช่องโปรดของฉัน (${favorites.size})`;
            }

            const filtered = channels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(filterText.toLowerCase()) || 
                                     ch.group.toLowerCase().includes(filterText.toLowerCase());
                
                let matchesCategory = false;
                if (filterCategory === 'FAVORITES') {
                    matchesCategory = favorites.has(ch.url);
                } else if (filterCategory === 'ALL') {
                    matchesCategory = true;
                } else {
                    matchesCategory = (ch.group === filterCategory);
                }

                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                const msg = filterCategory === 'FAVORITES' 
                    ? 'ยังไม่มีช่องรายการโปรด (กดไอคอน ❤️ เพื่อบันทึกช่องโปรด)' 
                    : 'ไม่พบช่องรายการที่ค้นหา';
                channelListEl.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-sub);">${msg}</div>`;
                return;
            }

            const limit = 200;
            const displayChannels = filtered.slice(0, limit);

            displayChannels.forEach((ch) => {
                const isFav = favorites.has(ch.url);
                const item = document.createElement('div');
                item.className = `channel-item ${currentPlayingChannel && currentPlayingChannel.url === ch.url ? 'active' : ''}`;
                
                item.innerHTML = `
                    <img class="channel-logo" src="${ch.logo || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
                    <div class="channel-info">
                        <div class="channel-title">${ch.name}</div>
                        <div class="channel-group">${ch.group}</div>
                    </div>
                    <button class="fav-btn ${isFav ? 'active' : ''}" title="${isFav ? 'ลบออกจากช่องโปรด' : 'บันทึกเป็นช่องโปรด'}">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                    </button>
                `;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playStream(ch);
                });

                const favBtn = item.querySelector('.fav-btn');
                favBtn.addEventListener('click', (e) => toggleFavorite(ch.url, e));

                channelListEl.appendChild(item);
            });

            if (filtered.length > limit) {
                const note = document.createElement('div');
                note.style.cssText = 'text-align:center; padding: 10px; font-size: 0.8rem; color: var(--text-sub);';
                note.textContent = `แสดง ${limit} ช่องแรก จากทั้งหมด ${filtered.length.toLocaleString()} ช่อง (พิมพ์ค้นหาเพื่อหาช่องที่ต้องการ)`;
                channelListEl.appendChild(note);
            }
        }

        // Update Player Heart Icon
        function updatePlayerFavBtn() {
            if (!currentPlayingChannel) {
                playerFavBtn.style.display = 'none';
                return;
            }
            playerFavBtn.style.display = 'block';
            const isFav = favorites.has(currentPlayingChannel.url);
            playerFavBtn.className = `player-fav-btn ${isFav ? 'active' : ''}`;
            playerFavBtn.innerHTML = `<i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>`;
        }

        // Stream Player Function
        function playStream(channel, useProxy = false) {
            currentPlayingChannel = channel;
            statusMessageEl.style.display = 'none';
            currentTitleEl.textContent = channel.name;
            
            if (channel.logo) {
                currentLogoEl.src = channel.logo;
                currentLogoEl.style.display = 'block';
            } else {
                currentLogoEl.style.display = 'none';
            }

            updatePlayerFavBtn();

            let streamUrl = useProxy ? CORS_PROXY + encodeURIComponent(channel.url) : channel.url;

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 8000
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log('Autoplay blocked:', e));
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if (!useProxy) {
                            console.log("Direct play failed, trying via Proxy...");
                            playStream(channel, true);
                        } else {
                            statusMessageEl.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:#e50914;"></i> สัญญาณช่องนี้ไม่พร้อมใช้งาน หรือล็อกโซนรับชม (Geo-blocked)`;
                            statusMessageEl.style.display = 'flex';
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari / iOS Native HLS
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
                video.onerror = function() {
                    if(!useProxy) {
                        playStream(channel, true);
                    } else {
                        statusMessageEl.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:#e50914;"></i> ไม่สามารถเล่นสัญญาณช่องนี้ได้`;
                        statusMessageEl.style.display = 'flex';
                    }
                };
            }
        }

        // Event Listeners
        loadUrlBtn.addEventListener('click', () => {
            const customUrl = m3uUrlInput.value.trim();
            if (customUrl) {
                fetchPlaylist(customUrl);
            }
        });

        m3uUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const customUrl = m3uUrlInput.value.trim();
                if (customUrl) {
                    fetchPlaylist(customUrl);
                }
            }
        });

        resetDefaultBtn.addEventListener('click', () => {
            m3uUrlInput.value = DEFAULT_M3U_URL;
            fetchPlaylist(DEFAULT_M3U_URL);
        });

        searchInput.addEventListener('input', (e) => {
            renderChannels(e.target.value, categorySelect.value);
        });

        categorySelect.addEventListener('change', (e) => {
            renderChannels(searchInput.value, e.target.value);
        });

        playerFavBtn.addEventListener('click', () => {
            if (currentPlayingChannel) {
                toggleFavorite(currentPlayingChannel.url);
            }
        });

        // App Init
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('iptv_last_url') || DEFAULT_M3U_URL;
            m3uUrlInput.value = savedUrl;
            fetchPlaylist(savedUrl);
        });
    </script>
</body>
</html>
