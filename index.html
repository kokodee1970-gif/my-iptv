<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player (.m3u)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 12px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #333; }
        input[type="text"] { flex: 1; min-width: 260px; padding: 10px 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
        input[type="text"]:focus { border-color: #007bff; }
        button, label.file-btn { background: #007bff; color: white; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-block; }
        button:hover, label.file-btn:hover { background: #0056b3; }
        input[type="file"] { display: none; }
        
        .container { display: flex; flex: 1; overflow: hidden; }
        .player-box { flex: 3; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        
        /* รายการช่อง และแท็บ */
        .playlist-box { flex: 1; max-width: 350px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .tab-buttons { display: flex; border-bottom: 1px solid #333; background: #222; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #888; cursor: pointer; border-bottom: 2px solid transparent; border-radius: 0; font-weight: bold; }
        .tab-btn.active { color: #fff; border-bottom-color: #007bff; background: #181818; }
        
        #playlistContainer { flex: 1; overflow-y: auto; }
        .channel-item { padding: 12px 15px; border-bottom: 1px solid #282828; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .channel-item:hover { background: #282828; }
        .channel-item.active { background: #007bff; color: white; font-weight: bold; }
        .channel-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* ปุ่มดาวช่องโปรด */
        .fav-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 5px; color: #666; transition: transform 0.1s; }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.is-fav { color: #ffca28; }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .playlist-box { max-width: 100%; height: 280px; }
        }
    </style>
</head>
<body>

    <header>
        <input type="text" id="m3uUrl" placeholder="วางลิงก์ URL .m3u ออนไลน์ที่นี่...">
        <button onclick="loadFromUrl()">โหลดจาก URL</button>
        <label class="file-btn">
            เลือกไฟล์ .m3u ในเครื่อง
            <input type="file" id="m3uFile" accept=".m3u,.m3u8" onchange="loadFromFile(event)">
        </label>
    </header>

    <div class="container">
        <div class="player-box">
            <video id="video" controls autoplay></video>
        </div>
        
        <div class="playlist-box">
            <!-- แท็บสลับช่องทั้งหมด vs ช่องโปรด -->
            <div class="tab-buttons">
                <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">ช่องทั้งหมด</button>
                <button class="tab-btn" id="tabFav" onclick="switchTab('fav')">⭐ ช่องโปรด</button>
            </div>
            
            <div id="playlistContainer">
                <div style="padding: 15px; color: #888;">กรุณาใส่ลิงก์หรืออัปโหลดไฟล์ .m3u เพื่อแสดงช่อง</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const playlistContainer = document.getElementById('playlistContainer');
        
        let hls = null;
        let allChannels = [];
        let favorites = JSON.parse(localStorage.getItem('iptv_favorites')) || []; // ดึงข้อมูลช่องโปรดจาก localStorage
        let currentTab = 'all'; // 'all' หรือ 'fav'
        let currentPlayingUrl = '';

        // 1. ฟังก์ชันแยกแยะไฟล์ M3U
        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let currentTitle = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const commaIdx = line.indexOf(',');
                    currentTitle = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'ไม่ระบุชื่อช่อง';
                } else if (line && !line.startsWith('#')) {
                    channels.push({
                        title: currentTitle || `ช่อง ${channels.length + 1}`,
                        url: line
                    });
                    currentTitle = '';
                }
            }
            return channels;
        }

        // 2. ฟังก์ชันสลับแท็บ (ช่องทั้งหมด / ช่องโปรด)
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabFav').classList.toggle('active', tab === 'fav');
            renderPlaylist();
        }

        // 3. ฟังก์ชัน เพิ่ม/ลบ ช่องโปรด
        function toggleFavorite(event, ch) {
            event.stopPropagation(); // ป้องกันไม่ให้คลิกดาวแล้วกลายเป็นการเล่นวิดีโอ
            
            const index = favorites.findIndex(f => f.url === ch.url);
            if (index > -1) {
                favorites.splice(index, 1); // ถ้ามีอยู่แล้วให้ลบออก
            } else {
                favorites.push(ch); // ถ้ายังไม่มีให้เพิ่ม
            }
            
            // บันทึกลง localStorage
            localStorage.setItem('iptv_favorites', JSON.stringify(favorites));
            renderPlaylist();
        }

        // 4. ฟังก์ชันแสดงรายการช่อง
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            
            // เลือกรายการที่จะแสดงผลตามแท็บที่เปิดอยู่
            const displayList = currentTab === 'all' ? allChannels : favorites;

            if (displayList.length === 0) {
                const msg = currentTab === 'all' 
                    ? 'ไม่พบรายการช่องในไฟล์นี้' 
                    : 'ยังไม่มีช่องโปรด (กดรูป ⭐ เพื่อบันทึกช่อง)';
                playlistContainer.innerHTML = `<div style="padding: 15px; color: #888;">${msg}</div>`;
                return;
            }

            displayList.forEach((ch, idx) => {
                const isFav = favorites.some(f => f.url === ch.url);
                const isPlaying = ch.url === currentPlayingUrl;

                const item = document.createElement('div');
                item.className = `channel-item ${isPlaying ? 'active' : ''}`;
                
                item.innerHTML = `
                    <span class="channel-title" title="${ch.title}">${idx + 1}. ${ch.title}</span>
                    <button class="fav-btn ${isFav ? 'is-fav' : ''}" title="${isFav ? 'ลบออกจากช่องโปรด' : 'เพิ่มในช่องโปรด'}">
                        ${isFav ? '★' : '☆'}
                    </button>
                `;

                // คลิกที่แถบเพื่อเล่นช่อง
                item.onclick = () => {
                    currentPlayingUrl = ch.url;
                    renderPlaylist();
                    playStream(ch.url);
                };

                // คลิกที่ปุ่มดาวเพื่อ เพิ่ม/ลบ ช่องโปรด
                const favBtn = item.querySelector('.fav-btn');
                favBtn.onclick = (e) => toggleFavorite(e, ch);

                playlistContainer.appendChild(item);
            });
        }

        // 5. ฟังก์ชันเล่นวิดีโอ
        function playStream(url) {
            const myProxy = "https://my-cors-proxy.ชื่อคุณ.workers.dev/?url="; // ใส่ Worker URL ของคุณที่นี่
            const proxiedUrl = url.startsWith('http') ? myProxy + encodeURIComponent(url) : url;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Auto-play blocked:", e));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                alert("ไม่สามารถเล่นช่องนี้ได้: สัญญาณต้นทางเสีย หรือติดข้อจำกัดความปลอดภัย");
                                hls.destroy();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.play();
            }
        }

        // 6. การโหลดไฟล์ออนไลน์/ในเครื่อง
        async function loadFromUrl() {
            const url = document.getElementById('m3uUrl').value.trim();
            if (!url) return alert('กรุณาระบุ URL ของไฟล์ .m3u');

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('ไม่สามารถดึงข้อมูลได้');
                const text = await res.text();
                allChannels = parseM3U(text);
                renderPlaylist();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโหลด URL: ' + err.message);
            }
        }

        function loadFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                allChannels = parseM3U(evt.target.result);
                renderPlaylist();
            };
            reader.readAsText(file);
        }

        // โหลดหน้าครั้งแรก ถ้ามีช่องโปรดค้างไว้ ให้กดสลับไปหน้าช่องโปรดได้ทันที
        renderPlaylist();
    </script>
</body>
</html>
