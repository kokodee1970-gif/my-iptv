  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 1.8rem; color: #38bdf8; }
    .container { display: flex; flex-direction: column; width: 100%; max-width: 900px; gap: 20px; }
    
    .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .control-box { display: flex; flex-direction: column; gap: 15px; background-color: #1e293b; padding: 18px; border-radius: 10px; border: 1px solid #334155; }
    .upload-zone { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .file-label { background-color: #059669; color: white; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
    .file-label:hover { background-color: #047857; }
    input[type="file"] { display: none; }
    
    .filter-zone { display: flex; align-items: center; gap: 10px; background-color: #0f172a; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; }
    .filter-zone label { font-size: 0.9rem; color: #38bdf8; font-weight: bold; }
    .filter-zone select { background-color: #1e293b; color: #fff; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; flex: 1; cursor: pointer; }
    
    .channel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .channel-btn { background-color: #1e293b; color: #e2e8f0; border: 2px solid #334155; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; word-break: break-word; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s; }
    .channel-btn:hover { background-color: #334155; border-color: #38bdf8; transform: translateY(-2px); }
    .channel-btn.active { background-color: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .channel-btn img { width: 40px; height: 40px; object-fit: contain; }
  </style>
</head>

  <h1>📺 TV Online BY KOKO 📺 </h1>

  <div class="container">

      <!-- แถบเลือกหมวดหมู่ -->

        <select id="categorySelect" onchange="filterChannels()">

    </div>

    const video = document.getElementById('video');
    const channelListContainer = document.getElementById('channelList');
    const categorySelect = document.getElementById('categorySelect');
    let hls = null;

    function playChannel(url, element) {
      document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => video.play().catch(() => {}));
      }
    }

    function updateCategoryDropdown() {
      const categories = new Set();
      channels.forEach(ch => categories.add(ch.group || 'ทั่วไป'));

      categorySelect.innerHTML = '<option value="ALL">ทั้งหมด (All Channels)</option>';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.innerText = cat;
        categorySelect.appendChild(option);
      });
    }

    function filterChannels() {
      const selectedCategory = categorySelect.value;
      const filtered = (selectedCategory === 'ALL') 
        ? channels 
        : channels.filter(ch => (ch.group || 'ทั่วไป') === selectedCategory);
      
      renderChannels(filtered);
    }

    function renderChannels(channelArrayToRender = channels) {
      channelListContainer.innerHTML = '';
      if (channelArrayToRender.length === 0) {
        channelListContainer.innerHTML = '<p style="color:#94a3b8;">ไม่พบรายการช่องในหมวดหมู่นี้</p>';
        return;
      }

      channelArrayToRender.forEach((ch, index) => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        
        let logoHtml = ch.logo ? `<img src="${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'">` : '';
        btn.innerHTML = `${logoHtml}<span>${ch.name}</span>`;
        
        btn.onclick = () => playChannel(ch.url, btn);
        channelListContainer.appendChild(btn);

        if (index === 0) playChannel(ch.url, btn);
      });
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').innerText = 'อัปเดตช่องจากไฟล์: ' + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        parseM3uPlaylist(content);
      };
      
      reader.readAsText(file);
    }

    function parseM3uPlaylist(data) {
      const lines = data.split('\n');
      const parsedChannels = [];
      let currentName = '';
      let currentGroup = 'ทั่วไป';
      let currentLogo = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        
        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          currentGroup = groupMatch ? groupMatch[1] : 'ทั่วไป';

          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          currentLogo = logoMatch ? logoMatch[1] : '';

          const commaIndex = line.lastIndexOf(',');
          currentName = (commaIndex !== -1) ? line.substring(commaIndex + 1).trim() : 'ช่องไม่มีชื่อ';
        } else if (line.length > 0 && !line.startsWith('#')) {
          parsedChannels.push({ 
            name: currentName || `ช่องที่ ${parsedChannels.length + 1}`, 
            group: currentGroup,
            logo: currentLogo,
            url: line 
          });
          currentName = '';
          currentGroup = 'ทั่วไป';
          currentLogo = '';
        }
      }

      if (parsedChannels.length > 0) {
        channels = parsedChannels;
        updateCategoryDropdown();
        renderChannels();
      } else {
        alert('ไม่พบรายการช่องสตรีมมิ่งในไฟล์นี้');
      }
    }

    window.onload = () => {
      updateCategoryDropdown();
      renderChannels();
    };
  </script>
